---

- name: Install Docker and Jenkins on Web instance
  hosts: jenkins
  become: yes
  gather_facts: true
  tasks:

    # 1. Update Ubuntu and install prerequisites
    - name: Update apt cache
    #   command:
    #     cmd: apt update 
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install dependencies
      ansible.builtin.apt:
        name:
            - curl
            - fontconfig
            - openjdk-21-jre
            - ca-certificates
            - wget
            - python3-apt
        state: present
        
    # 2. Install Docker using official script
    - name: Install Docker script
      ansible.builtin.get_url:
        url: https://get.docker.com
        dest: /tmp/get-docker.sh
        mode: '0755'
    
    - name: Run Docker script
      ansible.builtin.command:
        cmd: sh /tmp/get-docker.sh
        creates: /usr/bin/docker
    
    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create docker group
      ansible.builtin.group:
        name: docker
        state: present
        

    - name: Add current user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true  

    # - name:
    #   ansible.builtin.file:
    #     path: /var/run/docker.sock
    #     mode: '0666'
    #     state: file

    - name: Reset SSH connection so the new group applies
      ansible.builtin.meta: reset_connection

    # Install Jenkins

    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings/
        state: directory
        mode: '0755'

    - name: Add Jenkins apt key
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: '0644'

    - name: Add Jenkins apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins
        state: present

    - name: Install Jenkins
      ansible.builtin.apt:
        name: jenkins
        state: present
        update_cache: true
    
    - name: Add jenkins to docker group
      ansible.builtin.user:
        name: jenkins
        groups: docker
        append: true

    - name: Enable and start Jenkins
      ansible.builtin.service:
        name: jenkins
        state: restarted
        enabled: true