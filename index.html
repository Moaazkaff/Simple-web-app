<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple welcome page served by Apache.">
  <title>Welcome</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2937;
      background: #f3f6fb;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      padding: 1.5rem;
    }

    main {
      width: min(100%, 38rem);
      padding: clamp(2rem, 8vw, 4rem);
      border: 1px solid #e2e8f0;
      border-radius: 1rem;
      background: #fff;
      box-shadow: 0 1rem 3rem rgb(31 41 55 / 8%);
      text-align: center;
    }

    h1 {
      margin: 0 0 1rem;
      color: #1456c0;
      font-size: clamp(2rem, 7vw, 3rem);
      line-height: 1.1;
    }

    p {
      margin: 0;
      color: #526174;
      font-size: 1.125rem;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main>
    <h1>Welcome!</h1>
    <p>Your web server is up and running. Thanks for stopping by.</p>
  </main>
</body>
</html>
